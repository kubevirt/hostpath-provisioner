apiVersion: hostpathprovisioner.kubevirt.io/v1beta1
kind: HostPathProvisioner
metadata:
  name: hostpath-provisioner
spec:
  imagePullPolicy: Always
  storagePools:
    - name: "local"
      pvcTemplate:
        storageClassName: "rook-ceph-block-wffc"
        volumeMode: "Block"
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      path: "/var/hpvolumes"
  workload:
    nodeSelector:
      kubernetes.io/os: linux
