apiVersion: hostpathprovisioner.kubevirt.io/v1beta1
kind: HostPathProvisioner
metadata:
  name: hostpath-provisioner
spec:
  imagePullPolicy: Always
  storagePools:
    - name: block
      path: /var/hpvolumes
      pvcTemplate:
        volumeMode: Block
        storageClassName: rook-ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - name: filesystem
      path: /var/hpvolumes/filesystem
      pvcTemplate:
        volumeMode: Filesystem
        storageClassName: rook-ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  workload:
    nodeSelector:
      kubernetes.io/os: linux
